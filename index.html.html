<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心疫苗｜心理韌性 × 生活挑戰</title>
<style>
:root{--pink:#b5195a;--pink2:#d2306f;--cream:#fff5e6;--yellow:#fbbf24;--blue:#4fb3d9;--green:#5fa84d;--coral:#ee6c5f;--ink:#4a3b35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);min-height:100vh;background:repeating-conic-gradient(from 0deg at 50% 38%,#b5195a 0 10deg,#c42a68 10deg 20deg);background-attachment:fixed}
header{text-align:center;padding:16px 10px 4px;color:#fff;position:relative}
header h1{margin:0;font-size:clamp(30px,6vw,46px);letter-spacing:6px;text-shadow:3px 3px 0 rgba(0,0,0,.2);cursor:pointer}
header p{margin:2px 0 0;font-weight:700;color:var(--cream)}
.tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.tools button{border:0;background:var(--cream);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.wrap{max-width:920px;margin:0 auto;padding:10px 14px 30px}
.panel{background:var(--cream);border-radius:28px;padding:20px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.menu{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mcard{background:var(--cream);border:0;border-radius:24px;padding:14px 10px;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.2);font:inherit;color:var(--ink);transition:.15s;text-align:center}
.mcard:hover{transform:translateY(-4px)}.mcard:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.mcard img{width:96px;height:96px;object-fit:contain}
.mcard h2{margin:6px 0 2px;color:var(--pink);font-size:19px}.mcard p{margin:0;font-size:14px}
.btn{border:0;border-radius:999px;padding:11px 22px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:var(--pink);color:#fff;box-shadow:0 4px 0 #7d0f3d;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d0f3d}
.btn.alt{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 #c2910f}
.btn.ghost{background:#fff;color:var(--pink);box-shadow:0 4px 0 #e7c0d0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.top h2{margin:0;color:var(--pink);font-size:21px}
.stats{display:flex;gap:8px;font-weight:800;flex-wrap:wrap}
.stats span{background:#fff;padding:3px 12px;border-radius:999px;border:2px solid #f3c6d6}
.grid{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);max-width:600px;margin:0 auto}
.card{aspect-ratio:1;perspective:700px;cursor:pointer;border:0;background:none;padding:0}
.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden}
.b{background:linear-gradient(135deg,var(--pink2),var(--pink));color:#fff;font-size:clamp(24px,7vw,40px);font-weight:900;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.f{background:#fff;transform:rotateY(180deg);border:4px solid var(--yellow)}
.card.done .f{border-color:var(--green);background:#f1fbe9}
.f img{width:88%;height:88%;object-fit:contain}
.toast{min-height:54px;margin:14px auto 0;max-width:600px;background:#fff;border-radius:18px;padding:10px 14px;text-align:center;font-weight:700;border:2px dashed var(--pink2)}
.opts{display:grid;gap:10px;margin-top:12px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{background:#fff;border:3px solid #f3c6d6;border-radius:18px;padding:13px;font:inherit;font-size:17px;text-align:left;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--pink2);background:#fff0f6}
.opt.good{background:#e6f6da;border-color:var(--green)}.opt.bad{background:#ffe9e5;border-color:var(--coral)}
.q{font-size:clamp(18px,3.6vw,23px);font-weight:800;line-height:1.6}
.bar{height:14px;background:#f3c6d6;border-radius:99px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pink);transition:.3s}
.center{text-align:center}.big{width:min(210px,55%);max-height:210px;object-fit:contain}
.result h3{color:var(--pink);font-size:26px;margin:8px 0}
.tips{text-align:left;background:#fff;border-radius:18px;padding:12px 18px 12px 34px;line-height:1.9}
.note{font-size:13px;opacity:.85;margin-top:12px;line-height:1.7}
.scene{border-radius:24px;padding:14px;min-height:230px;display:flex;align-items:center;justify-content:center;gap:6px}
.scene img{width:min(210px,46%);max-height:210px;object-fit:contain;animation:bob 3s ease-in-out infinite}
.scene img:nth-child(2){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.stxt{font-size:clamp(18px,3.6vw,22px);line-height:1.9;font-weight:600;min-height:110px;margin:10px 0;text-align:center}
.stxt b{color:var(--pink)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}.dots i{width:10px;height:10px;border-radius:50%;background:#f3c6d6}.dots i.on{background:var(--pink)}
.hide{display:none!important}
.bgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.badge{background:#fff;border-radius:20px;padding:10px 6px;text-align:center;border:3px solid var(--yellow);font-size:13px;line-height:1.5}
.badge img{width:70px;height:70px;object-fit:contain}.badge b{display:block;font-size:15px;color:var(--pink)}
.badge.lock{border-color:#ddd;color:#999}.badge.lock img{filter:grayscale(1) opacity(.35)}.badge.lock b{color:#999}
.pop{position:fixed;left:50%;top:-120px;transform:translateX(-50%);background:var(--yellow);color:var(--ink);border-radius:22px;padding:10px 18px;display:flex;gap:10px;align-items:center;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.25);z-index:9;transition:top .5s}
.pop.show{top:14px}.pop img{width:54px;height:54px;object-fit:contain}
.breath{width:min(260px,70vw);aspect-ratio:1;margin:10px auto;border-radius:50%;background:radial-gradient(#fff,#ffd3e3);border:6px solid var(--pink2);display:flex;align-items:center;justify-content:center;transform:scale(.55);transition:transform 4s ease-in-out}
.breath img{width:62%}
.mood{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.mood button{background:#fff;border:3px solid #f3c6d6;border-radius:18px;padding:8px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.mood button:hover{border-color:var(--pink2)}.mood img{width:70px;height:70px;object-fit:contain;display:block;margin:0 auto 2px}
.draw{width:min(250px,80%);margin:10px auto;background:#fff;border:6px solid var(--yellow);border-radius:24px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
footer{text-align:center;color:var(--cream);font-size:12px;padding:0 14px 24px;line-height:1.8}
</style>
</head>

/* ============ 音效（Web Audio 合成，不需外部檔案） ============ */
let AC=null, soundOn=true, bgmOn=false, bgmTimer=null;
const ac = () => AC || (AC = new (window.AudioContext||window.webkitAudioContext)());
function tone(f,d=.15,type='sine',v=.12,delay=0){
  if(!soundOn&&type!=='bgm')return; try{const c=ac(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
  o.type=type==='bgm'?'sine':type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05);}catch(e){}
}
const SFX = {
  click:()=>tone(660,.08,'triangle'),
  flip:()=>{tone(500,.07,'triangle');tone(700,.07,'triangle',.1,.05)},
  ok:()=>{tone(660,.15,'sine',.14);tone(880,.2,'sine',.14,.12)},
  no:()=>{tone(300,.2,'sine',.1);tone(240,.25,'sine',.1,.15)},
  win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.13,i*.12)),
  badge:()=>[880,1175,1568,2093].forEach((f,i)=>tone(f,.3,'sine',.1,i*.09)),
  inh:()=>tone(330,1,'sine',.07), exh:()=>tone(262,1.4,'sine',.07)
};
const sfx = n => SFX[n]&&SFX[n]();
function bgmLoop(){ const sc=[523,587,659,784,880,784,659,587]; let i=0;
  bgmTimer=setInterval(()=>{ if(!bgmOn)return; tone(sc[i%8]/2,1.2,'bgm',.04); if(i%4===0)tone(sc[(i+2)%8],.8,'bgm',.025); i++; },900); }

  const b=BADGES[id]; const p=document.getElementById('pop');
  setTimeout(()=>{p.innerHTML=`${S(b[0])}<div>🏅 獲得徽章<br>${b[1]}</div>`;p.classList.add('show');sfx('badge');setTimeout(()=>p.classList.remove('show'),3200)},900);
  if(id!=='all'&&Object.keys(BADGES).filter(k=>k!=='all').every(k=>got[k]))award('all');
}
function badges(){
  stopAll(); const n=Object.keys(got).length;

function memory(theme,level){
  stopAll();
  if(!theme){ $app.innerHTML=`<div class="panel center"><h2 style="color:var(--pink)">翻翻看：選擇貼圖主題</h2>
    <button class="btn" onclick="memory('c')">🐱 喵葫蘆暖心日常</button><button class="btn alt" onclick="memory('q')">🦘 微笑袋鼠</button><button class="btn" onclick="memory('m')">🌈 兩組混合</button><br><button class="btn ghost" onclick="home()">回首頁</button></div>`;return;}
  if(!level){ $app.innerHTML=`<div class="panel center"><h2 style="color:var(--pink)">選擇難度</h2><p>找出兩張一樣的貼圖，沒有時間壓力，慢慢來。</p>
    <button class="btn" onclick="memory('${theme}',4)">🌱 簡單（4 對）</button><button class="btn alt" onclick="memory('${theme}',6)">🌼 中等（6 對）</button><button class="btn" onclick="memory('${theme}',8)">🌈 挑戰（8 對）</button><br><button class="btn ghost" onclick="memory()">回上一步</button></div>`;return;}
  const pool=ALL.filter(k=>theme==='m'||k[0]===theme);
  const ids=shuf(pool).slice(0,level), deck=shuf([...ids,...ids]);
  let first=null,lock=false,moves=0,pairs=0,sec=0;
  $app.innerHTML=`<div class="panel"><div class="top"><h2>翻翻看</h2><div class="stats"><span>步數 <b id="mv">0</b></span><span>時間 <b id="tm">0</b>s</span><span>配對 <b id="pr">0</b>/${level}</span></div></div>
   <div class="grid" id="g"></div><div class="toast" id="ts">翻開兩張一樣的貼圖吧！🙂</div>
   <div class="center" style="margin-top:10px"><button class="btn alt" onclick="memory('${theme}',${level})">重新洗牌</button><button class="btn ghost" onclick="memory()">換主題</button><button class="btn ghost" onclick="home()">回首頁</button></div></div>`;
  const g=document.getElementById('g');
  deck.forEach(id=>{ const c=document.createElement('button'); c.className='card';
    c.innerHTML=`<div class="in"><div class="b">心</div><div class="f">${S(id)}</div></div>`;
    c.onclick=()=>{ if(lock||c.classList.contains('open')||c.classList.contains('done'))return;
      if(!timer)timer=setInterval(()=>{document.getElementById('tm').textContent=++sec},1000);
      sfx('flip'); c.classList.add('open'); c.dataset.id=id;
      if(!first){first=c;return;}
      moves++; document.getElementById('mv').textContent=moves;
      if(first.dataset.id===id){ const a=first; first=null;
        setTimeout(()=>{a.classList.replace('open','done');c.classList.replace('open','done');sfx('ok')},350);
        pairs++; document.getElementById('pr').textContent=pairs; document.getElementById('ts').innerHTML='💬 '+pick(TIPS);
        if(pairs===level){stopAll();setTimeout(()=>memWin(theme,level,moves,sec),900)}
      } else { lock=true; const a=first; first=null; setTimeout(()=>{sfx('no');a.classList.remove('open');c.classList.remove('open');lock=false},850); }
    }; g.appendChild(c); });
}
function memWin(theme,level,moves,sec){
  sfx('win'); award('mem'); if(level===8)award('memhard'); if(level===4&&moves<=8)award('memperf');
  $app.innerHTML=`<div class="panel center result">${S(pick(ALL),'big')}<h3>🎉 全部配對成功！</h3><p>共 ${moves} 步，用時 ${sec} 秒</p>

   <button class="btn" onclick="memory('${theme}',${level})">再玩一次</button><button class="btn alt" onclick="memory('${theme}')">換難度</button><button class="btn ghost" onclick="home()">回首頁</button></div>`;
}

function mood(){
  stopAll(); $app.innerHTML=`<div class="panel center"><h2 style="color:var(--pink)">🌤️ 心情氣象站</h2><p class="q">此刻的你，心情像哪種天氣？</p>
   <div class="mood">${MOODS.map((m,k)=>`<button data-k="${k}">${S(m[1])}${m[0]}</button>`).join('')}</div><button class="btn ghost" onclick="home()">回首頁</button></div>`;
  $app.querySelectorAll('.mood button').forEach(b=>b.onclick=()=>{ const m=MOODS[+b.dataset.k]; sfx('ok'); award('mood');
   $app.innerHTML=`<div class="panel center result">${S(m[1],'big')}<h3>${m[0]}</h3><p class="q">${m[2]}</p><div class="tips" style="list-style:none;padding-left:18px">💡 小提醒：${m[3]}</div>
   <p class="note">所有心情都是正常的。若不舒服的感受持續很久，別忘了向身邊的人或專業人員求助。</p>
   <button class="btn" onclick="mood()">再選一次</button><button class="btn alt" onclick="breath()">做呼吸練習</button><button class="btn ghost" onclick="home()">回首頁</button></div>`; });
}

/* ============ 5. 呼吸練習 ============ */
function breath(){
  stopAll(); let round=0; const TOTAL=4;
  $app.innerHTML=`<div class="panel center"><h2 style="color:var(--pink)">🌬️ 4-6 呼吸練習</h2><p>舒服地坐好，跟著圓圈一起：吸氣 4 秒、吐氣 6 秒。</p>
   <div class="breath" id="bc">${S('c35')}</div><p class="q" id="bt">按「開始」就可以囉</p><div class="stats" style="justify-content:center"><span>第 <b id="br">0</b> / ${TOTAL} 回合</span></div>
   <button class="btn" id="bs">開始</button><button class="btn ghost" onclick="home()">回首頁</button></div>`;
  const bc=document.getElementById('bc'), bt=document.getElementById('bt');
  const inhale=()=>{ if(round>=TOTAL){ bc.style.transform='scale(.8)'; bt.innerHTML='🎉 做得很好！感覺有輕鬆一點嗎？'; sfx('win'); award('breath'); return; }
    round++; document.getElementById('br').textContent=round; bt.textContent='吸氣… 1 2 3 4'; bc.style.transition='transform 4s ease-in-out'; bc.style.transform='scale(1)'; sfx('inh');
    breathT=setTimeout(()=>{ bt.textContent='吐氣… 1 2 3 4 5 6'; bc.style.transition='transform 6s ease-in-out'; bc.style.transform='scale(.55)'; sfx('exh'); breathT=setTimeout(inhale,6000); },4000); };
  document.getElementById('bs').onclick=()=>{ clearTimeout(breathT); round=0; ac(); inhale(); };
}

/* ============ 6. 暖心回應 ============ */
const RP=[
 ['朋友說：「我這次考試考超爛，我是不是很笨？」','c02',[['你才不笨，別想太多！',0],['考不好一定很難受。你想聊聊嗎？',1],['下次認真點就好了。',0]],'先接住情緒，再討論方法，對方比較容易感到被理解。'],
 ['家人說：「最近工作壓力好大，我好累。」','q09',[['大家都很累啊。',0],['聽起來你真的辛苦了，我可以幫你做點什麼？',1],['你就是想太多。',0]],'肯定辛苦、提供協助，比比較或否定更有幫助。'],
 ['同學被排擠，小聲說：「我好像沒有朋友……」','q26',[['我在這裡，願意陪你，你想說什麼都可以。',1],['那你要主動一點啊。',0],['別理他們就好。',0]],'孤單時，被陪伴與傾聽很重要。'],
 ['朋友生氣地說：「他居然這樣對我！」','c19',[['冷靜一點啦。',0],['你一定很生氣。發生什麼事了？',1],['可能是你誤會了吧。',0]],'先回應情緒，不急著評斷誰對誰錯。'],
 ['長輩說：「我現在手機都不太會用，覺得自己很沒用。」','c30',[['學習需要時間，我陪您慢慢學，您已經很棒了。',1],['這很簡單啊，怎麼學不會？',0],['不會就不要用了。',0]],'用鼓勵與耐心，替對方保留自信。']
];
function reply(){
  stopAll(); const qs=shuf(RP); let n=0,ok=0;
  const draw=()=>{
    if(n>=qs.length){ sfx('win'); if(ok>=4)award('reply'); $app.innerHTML=`<div class="panel center result">${S(ok>=4?'c09':'c06','big')}<h3>答對 ${ok} / ${qs.length} 題</h3><p class="q">好好傾聽，是送給別人最溫暖的禮物。</p>
      <button class="btn" onclick="reply()">再玩一次</button><button class="btn ghost" onclick="home()">回首頁</button></div>`; return; }
    const [q,img,o,why]=qs[n];
    $app.innerHTML=`<div class="panel"><div class="top"><h2>💬 暖心回應</h2><div class="stats"><span>${n+1} / ${qs.length}</span></div></div><div class="center">${S(img,'big')}</div>
     <p class="q">${q}</p><p class="note">哪一種回應比較能讓對方感到被支持？</p><div class="opts">${shuf(o).map(x=>`<button class="opt" data-g="${x[1]}">${x[0]}</button>`).join('')}</div><div class="toast hide" id="ts"></div></div>`;
    $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const g=b.dataset.g==='1'; if(g)ok++; sfx(g?'ok':'no'); b.classList.add(g?'good':'bad');
      $app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.g==='1')x.classList.add('good')});
      const t=document.getElementById('ts');t.classList.remove('hide');t.innerHTML=(g?'✅ 很棒！':'💡 再想想：')+why+'<br><button class="btn" id="nx">'+(n+1<qs.length?'下一題':'看結果')+'</button>';
      document.getElementById('nx').onclick=()=>{n++;draw()}; });
  }; draw();
}

/* ============ 7. 換個角度想（認知彈性） ============ */
const RF=[
 ['我這次搞砸了，我一定是個失敗者。','q04',['犯錯不等於失敗，我可以從中學到東西。','對，我就是不行。'],'把「一次失敗」和「整個人」分開來看。'],
 ['大家一定都在笑我。','c36',['我不一定知道別人怎麼想，也許他們根本沒注意。','他們一定都討厭我。'],'我們常「讀心」，但事實可能不是這樣。'],
 ['如果事情不完美，就等於沒有價值。','q08',['我可以先完成，再慢慢進步。','要不然就乾脆不要做。'],'完成比完美重要，進步是慢慢累積的。'],
 ['我永遠都學不會這個。','q32',['現在還不熟練，多練習會慢慢進步。','我就是沒天分，放棄吧。'],'把「永遠」換成「目前」，給自己成長空間。'],
 ['都是我的錯，我連累了大家。','c07',['我有責任的部分可以改進，但不是所有事都由我決定。','我什麼都做不好。'],'區分「自己能負責的」與「不屬於自己的」。']
];
function reframe(){
  stopAll(); const qs=shuf(RF); let n=0,ok=0;
  const draw=()=>{
    if(n>=qs.length){ sfx('win'); if(ok>=4)award('reframe'); $app.innerHTML=`<div class="panel center result">${S(ok>=4?'q18':'q03','big')}<h3>答對 ${ok} / ${qs.length} 題</h3><p class="q">想法不等於事實，換個角度，心情也會不一樣。</p>
      <button class="btn" onclick="reframe()">再玩一次</button><button class="btn ghost" onclick="home()">回首頁</button></div>`; return; }
    const [q,img,o,why]=qs[n];
    $app.innerHTML=`<div class="panel"><div class="top"><h2>🔄 換個角度想</h2><div class="stats"><span>${n+1} / ${qs.length}</span></div></div><div class="center">${S(img,'big')}</div>
     <p class="q">心裡的小聲音說：「${q}」</p><p class="note">哪一個想法比較有彈性、更能幫助自己？</p><div class="opts">${shuf(o.map((t,k)=>[t,k===0])).map(x=>`<button class="opt" data-g="${x[1]?1:0}">${x[0]}</button>`).join('')}</div><div class="toast hide" id="ts"></div></div>`;
    $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const g=b.dataset.g==='1'; if(g)ok++; sfx(g?'ok':'no'); b.classList.add(g?'good':'bad');
      $app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.g==='1')x.classList.add('good')});
      const t=document.getElementById('ts');t.classList.remove('hide');t.innerHTML=(g?'✅ ':'💡 ')+why+'<br><button class="btn" id="nx">'+(n+1<qs.length?'下一題':'看結果')+'</button>';
      document.getElementById('nx').onclick=()=>{n++;draw()}; });
  }; draw();
}
